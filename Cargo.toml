[package]
name = "yumo-audio"
version = "0.1.0"
edition = "2021"
authors = ["yumo XiaoDi"]
license = "MIT"
description = "Cross-platform audio mixing playback library (Rust port of Yumo Audio)"
repository = "https://github.com/xiaoditx/rust-yumo"

[lib]
name = "yumo"
path = "src/lib.rs"

[dependencies]
cpal = "0.15"
rubato = "0.15"
parking_lot = "0.12"
once_cell = "1.19"

[dev-dependencies]
 inquire = { version = "0.7", default-features = false, features = ["crossterm"] }

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "audio_pool"
path = "examples/audio_pool.rs"

[[example]]
name = "audio_mix"
path = "examples/audio_mix.rs"

[[example]]
name = "play_control"
path = "examples/play_control.rs"

[profile.release]
opt-level = 3
